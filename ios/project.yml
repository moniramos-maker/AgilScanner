name: AgilScannerIOS
options:
  bundleIdPrefix: com.agil
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  AgilScannerIOS:
    type: application
    platform: iOS
    sources:
      - path: AgilScannerIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agil.scanner.ios
        PRODUCT_NAME: "ÁGIL Scanner"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: AgilScannerIOS/Info.plist
      properties:
        CFBundleDisplayName: "ÁGIL Scanner"
        UILaunchScreen: {}
        NSCameraUsageDescription: "O ÁGIL Scanner usa a câmera para digitalizar documentos."
        NSPhotoLibraryUsageDescription: "O ÁGIL Scanner pode importar documentos da sua biblioteca."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
