name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/agil-release.jks

      - name: Build signed release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: agil-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Build debug APK fallback
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: gradle assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk AgilScanner.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk AgilScanner.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgilScanner-APK
          path: AgilScanner.apk

      - name: Read version
        id: version
        shell: bash
        run: |
          CODE=$(grep -oP 'versionCode = \\K[0-9]+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName = "\\K[^"]+' app/build.gradle.kts | head -1)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish latest release
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        shell: bash
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" AgilScanner.apk#AgilScanner.apk \
            --target "$GITHUB_SHA" \
            --title "ÁGIL Scanner $VERSION_NAME" \
            --notes "Atualização oficial do ÁGIL Scanner. O aplicativo verifica esta versão automaticamente ao iniciar." \
            --latest
